<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>沉香大屏｜素材裁切预览</title>
<style>
:root{color-scheme:dark;--bg:#081321;--card:#102238;--ink:#e8f3ff;--muted:#91a8bd;--line:#244968}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}header{padding:28px max(24px,4vw) 20px;border-bottom:1px solid var(--line)}h1{margin:0 0 6px;font-size:24px}p{margin:4px 0;color:var(--muted)}.note{max-width:1000px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px max(24px,4vw);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);z-index:2}.toolbar button,.toolbar a{border:1px solid #34709d;background:#102b45;color:var(--ink);padding:7px 12px;border-radius:6px;text-decoration:none;cursor:pointer}.toolbar button.active{background:#17608b}.count{margin-left:auto;color:var(--muted)}main{padding:0 max(24px,4vw) 48px}.group{margin:22px 0 30px}.group h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px;min-width:0}.preview{min-height:130px;display:grid;place-items:center;border-radius:5px;overflow:hidden;background-color:#1d2934;background-image:linear-gradient(45deg,#35424c 25%,transparent 25%),linear-gradient(-45deg,#35424c 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#35424c 75%),linear-gradient(-45deg,transparent 75%,#35424c 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.light .preview{background-color:#fff;background-image:linear-gradient(45deg,#d6dbe0 25%,transparent 25%),linear-gradient(-45deg,#d6dbe0 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#d6dbe0 75%),linear-gradient(-45deg,transparent 75%,#d6dbe0 75%)}.preview img{display:block;max-width:100%;max-height:260px;width:auto;height:auto}.scene{grid-column:1 / -1}.scene .preview img{max-height:680px}.assistant .preview{min-height:390px}.assistant .preview img{max-height:none;max-width:100%}.name{margin-top:10px;font-weight:650;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:12px}.download{display:inline-block;margin-top:8px;color:#7dcfff}
</style></head>
<body><header><h1>沉香产业大脑｜素材裁切预览</h1><p class="note">共32张 PNG：1张合成场景、4个顶部指标图标、1张助手去山林场景，以及9个面板、10个图标、3个页面装饰背景、1张手写题字、3张助手素材。原稿为合成 PNG；边框玻璃和被遮挡的光环弧线经过重建；书法从原图单独提取。</p></header>
<div class="toolbar"><button id="dark" class="active">深色棋盘</button><button id="light">浅色棋盘</button><a href="./">完整大屏 /</a><a href="./layers.html">分层检查 /layers.html</a><span id="count" class="count"></span></div><main id="app"></main>
<script>
const base='assets/extracted/';
const groups=[['全屏背景 + 中心树 + 6个溯源图标','scene',[['full-scene',base+'scene/full-scene.png']]],['面板（玻璃填充为局部重建）','panels',Object.keys({"metric-archive":1,"metric-batch":1,"metric-nodes":1,"metric-ai":1,"capabilities":1,"alerts":1,"assistant":1,"products":1,"brand-story":1}).map(n=>[n,base+'panels/'+n+'.png'])],['顶部4个指标图标','metrics',['archive','batch','nodes','ai'].map(n=>['kpi-'+n,base+'metrics/'+n+'.png'])],['图标','icons',Object.keys({"trace-nursery":1,"trace-base":1,"trace-raw":1,"trace-factory":1,"trace-product":1,"trace-transport":1,"ai-knowledge":1,"ai-traceability":1,"ai-analysis":1,"ai-warning":1}).map(n=>[n,base+'icons/'+n+'.png'])],['页面装饰与手写题字','chrome',[['header-background',base+'chrome/header-background.png'],['footer-background',base+'chrome/footer-background.png'],['status-background',base+'chrome/status-background.png'],['slogan',base+'chrome/slogan.png']]],['数字人素材','assistant',[['assistant-scene',base+'assistant/assistant-scene.png'],['assistant-background',base+'assistant/assistant-background.png'],['assistant-character',base+'assistant/assistant-character.png'],['assistant-calligraphy',base+'assistant/assistant-calligraphy.png']]]];
async function init(){const map=await fetch(base+'../extracted/source-map.json').then(r=>r.json());let total=0;for(const [title,kind,items] of groups){const section=document.createElement('section');section.className='group';section.innerHTML='<h2>'+title+'</h2><div class="grid"></div>';const grid=section.querySelector('.grid');for(const [name,src] of items){total++;const card=document.createElement('article');card.id=name;card.className='card '+kind;const img=new Image();img.src=src;img.alt=name;const preview=document.createElement('div');preview.className='preview';preview.append(img);const meta=document.createElement('div');meta.className='meta';meta.textContent='读取尺寸中…';img.onload=()=>meta.textContent=img.naturalWidth+' × '+img.naturalHeight+' px';card.innerHTML='<div class="name">'+name+'</div>';card.prepend(preview);card.append(meta);const a=document.createElement('a');a.className='download';a.href=src;a.download=name+'.png';a.textContent='下载 PNG';card.append(a);grid.append(card)}document.querySelector('#app').append(section)}document.querySelector('#count').textContent=total+' / 32 张';}
document.querySelector('#dark').onclick=()=>{document.body.classList.remove('light');dark.classList.add('active');light.classList.remove('active')};document.querySelector('#light').onclick=()=>{document.body.classList.add('light');light.classList.add('active');dark.classList.remove('active')};init();
</script></body></html>
