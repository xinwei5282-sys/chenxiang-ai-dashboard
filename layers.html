<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>广垦沉香 · 分层预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#071523;color:#e6eff7;font:14px system-ui,-apple-system,"PingFang SC",sans-serif;display:flex;height:100vh}main{flex:1;min-width:0;display:flex;align-items:center;background:#030c15}iframe{border:0;width:100%;height:100%}aside{width:290px;flex-shrink:0;padding:27px 22px;border-left:1px solid #21445d;overflow:auto}h1{font-size:21px;line-height:1.5;margin:0 0 8px}p{color:#a6bfd1;font-size:13px;line-height:1.7}.row{display:flex;gap:10px;align-items:flex-start;padding:15px 0;border-bottom:1px solid #234159}label{flex:1;line-height:1.5;cursor:pointer}input{accent-color:#49c9f1;margin:4px 8px 0 0;vertical-align:top}label span{display:inline-block;max-width:180px}small{color:#88a9bf;display:block;margin:4px 0 0 25px;font-size:11px}button{font:inherit;color:#d2ecff;background:#12324a;border:1px solid #2c6281;border-radius:5px;padding:5px 8px;cursor:pointer}.row button{font-size:11px;padding:4px 7px;white-space:nowrap;margin-top:2px}button:hover{background:#1a4966}.reset{width:100%;margin-top:22px;padding:10px}a{color:#78d8ff;text-decoration:none;display:block;margin-top:18px}.note{font-size:11px;color:#849eb2;margin-top:18px}
</style></head><body><main><iframe id="preview" src="/" title="大屏分层画布"></iframe></main><aside><h1>大屏分层预览</h1><p>逐层开关，查看素材与前端文字的叠加关系。</p><div id="controls"></div><div class="row"><label><input id="copy" type="checkbox" checked><span>文字、数据和其他内容</span></label></div><button class="reset" id="reset">恢复完整页面</button><a href="/" target="_blank" rel="noopener">打开完整大屏 ↗</a><p class="note">山谷与中心树使用循环视频，6个溯源图标和节点文字独立。助手光晕、人物、书法可分别开关。</p></aside><script>
const groups=[[1,'循环视频背景 · 中心树'],[2,'独立面板背景 PNG'],[3,'6个溯源图标 + 4个AI能力图标'],[4,'六节点蓝色环形连线'],[5,'全产业链运行状态条背景'],[6,'顶部背景 + 底部背景'],[7,'助手原图场景底层'],[8,'助手人物 PNG'],[9,'右侧书法与印章 PNG'],[10,'右上角手写题字 PNG'],[11,'顶部4个原图指标图标']];
const controls=document.querySelector('#controls');controls.innerHTML=groups.map(([id,name],i)=>`<div class="row"><label><input type="checkbox" data-group="${id}" checked><span>${i+1}. ${name}</span></label><button data-only="${id}">单独看</button></div>`).join('');
const frame=document.querySelector('#preview');let doc,style;
function render(){if(!doc)return;const visible=[...controls.querySelectorAll('input:checked')].map(e=>e.dataset.group);const copy=document.querySelector('#copy').checked;let rules='';
if(!copy){rules+='#screen *{visibility:hidden!important}';for(const id of visible)rules+=`#screen [data-layer="${id}"]{visibility:visible!important}`;}
else{for(let i=1;i<=11;i++)if(!visible.includes(String(i)))rules+=`#screen [data-layer="${i}"]{visibility:hidden!important}`;}
style.textContent=rules;}
frame.addEventListener('load',()=>{doc=frame.contentDocument;style=doc.createElement('style');doc.head.append(style);render()});
controls.addEventListener('change',render);document.querySelector('#copy').addEventListener('change',render);
controls.addEventListener('click',e=>{if(!e.target.dataset.only)return;controls.querySelectorAll('input').forEach(c=>c.checked=c.dataset.group===e.target.dataset.only);document.querySelector('#copy').checked=false;render()});
document.querySelector('#reset').onclick=()=>{controls.querySelectorAll('input').forEach(c=>c.checked=true);document.querySelector('#copy').checked=true;render()};
</script></body></html>
